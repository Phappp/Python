{% extends 'base.html' %}
{% block content %}
<style>
    .select-course-title {
        font-weight: 700;
        font-size: 2rem;
        color: #4facfe;
        text-align: center;
        margin-bottom: 32px;
        margin-top: 12px;
    }
    .select-course-card {
        background: rgba(255,255,255,0.88);
        backdrop-filter: blur(10px);
        border-radius: 22px;
        box-shadow: 0 8px 32px rgba(80,120,220,0.13), 0 2px 8px rgba(0,0,0,0.08);
        /* border: 2.5px solid; */
        border-image: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%) 1;
        transition: box-shadow 0.2s;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .select-course-card .card-title {
        font-weight: 600;
        color: #1976d2;
        font-size: 1.2rem;
        margin-bottom: 18px;
        text-align: center;
    }
    .btn-gradient {
        background: linear-gradient(135deg, #27ae60, #2ecc71);
        color: #fff !important;
        border: none;
        border-radius: 14px;
        font-weight: 600;
        padding: 12px 28px;
        font-size: 1.1rem;
        box-shadow: 0 4px 16px rgba(39,174,96,0.13);
        transition: all 0.2s;
        margin-top: auto;
    }
    .btn-gradient:hover {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        color: #fff !important;
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 8px 24px rgba(80,120,220,0.13);
    }
</style>
<div class="container mt-4">
    <h2 class="select-course-title">Chọn khóa học để quản lý bài tập</h2>
    <div class="row">
        {% for course in courses %}
        <div class="col-md-4 mb-3">
            <div class="select-course-card p-4">
                <h5 class="card-title">{{ course.name }}</h5>
                <a href="{{ url_for('exercise.manage_exercises', course_id=course._id) }}"
                    class="btn btn-gradient mt-3"><i class="fas fa-tasks me-1"></i>Quản lý bài tập</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
